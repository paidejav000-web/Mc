<!DOCTYPE html>
<html>
<head>
<title>Credit Tracker v1.2.2</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="blue">

<div class="topbar">
    <h2>Credit Tracker</h2>

    <div class="controls">

        <input id="search" placeholder="Search">

        <select id="sort">
            <option value="none">Sort</option>
            <option value="high">Highest</option>
            <option value="low">Lowest</option>
            <option value="az">A-Z</option>
        </select>

        <select id="theme">
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
            <option value="green">Green</option>
            <option value="midnight">Midnight</option>
        </select>

        <button onclick="openLogs()">Logs</button>
        <button onclick="openAdd()">+ Add</button>

    </div>
</div>

<div id="people"></div>

<!-- ADD PERSON MODAL -->
<div class="modal" id="addModal">
    <div class="box">
        <h3>Add Person</h3>
        <input id="addName" placeholder="Name">

        <div class="actions">
            <button onclick="closeAll()">Cancel</button>
            <button onclick="confirmAdd()">Create</button>
        </div>
    </div>
</div>

<!-- TRANSACTION MODAL -->
<div class="modal" id="txModal">
    <div class="box">

        <h3 id="txTitle"></h3>

        <input id="txAmount" type="number" placeholder="Amount">
        <input id="txReason" placeholder="Reason">
        <input id="txPass" type="password" placeholder="Admin Password">

        <div class="actions">
            <button onclick="closeAll()">Cancel</button>
            <button onclick="confirmTx()">Submit</button>
        </div>

    </div>
</div>

<!-- HISTORY -->
<div class="modal" id="historyModal">
    <div class="box scroll">

        <h3 id="historyTitle"></h3>
        <div id="historyList"></div>
        <canvas id="chart"></canvas>

        <button onclick="closeAll()">Close</button>

    </div>
</div>

<!-- LOGS -->
<div class="modal" id="logModal">
    <div class="box scroll">

        <h3>Update Logs</h3>
        <div id="logList"></div>

        <button onclick="closeAll()">Close</button>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
