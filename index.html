<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXY Credit Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AXY Credit Manager</h1>
            <button id="add-person-btn" class="btn btn-primary">+ Add New Person</button>
        </header>

        <main id="people-container" class="people-grid">
            </main>
    </div>

    <div id="person-modal" class="modal">
        <div class="modal-content">
            <h3>Add New Person</h3>
            <div class="form-group">
                <label for="new-person-name">Full Name</label>
                <input type="text" id="new-person-name" placeholder="Enter name...">
            </div>
            <div class="modal-actions">
                <button id="close-modal" class="btn btn-secondary">Cancel</button>
                <button id="save-person-btn" class="btn btn-primary">Add Person</button>
            </div>
        </div>
    </div>

    <div id="tx-modal" class="modal">
        <div class="modal-content">
            <h3 id="tx-modal-title">Modify Credits</h3>
            <input type="hidden" id="tx-person-id">
            <input type="hidden" id="tx-type">

            <div class="form-group">
                <label for="tx-amount">Amount (Credits)</label>
                <input type="number" id="tx-amount" step="0.01" min="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="tx-reason">Reason for Change</label>
                <input type="text" id="tx-reason" placeholder="e.g., Project bonus, Overdue penalty...">
            </div>
            <div class="form-group">
                <label for="tx-password">Admin Password</label>
                <input type="password" id="tx-password" placeholder="Enter password to authorize...">
            </div>

            <div class="modal-actions">
                <button id="close-tx-modal" class="btn btn-secondary">Cancel</button>
                <button id="submit-tx-btn" class="btn btn-primary">Confirm</button>
            </div>
        </div>
    </div>

    <div id="alert-modal" class="modal">
        <div class="modal-content alert-content">
            <h3 id="alert-title" class="text-danger">Notice</h3>
            <p id="alert-message">Message goes here.</p>
            <div class="modal-actions">
                <button id="close-alert-btn" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal">
        <div class="modal-content">
            <h3>Are you sure?</h3>
            <p id="confirm-message">This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="confirm-cancel-btn" class="btn btn-secondary">Cancel</button>
                <button id="confirm-ok-btn" class="btn btn-danger">Delete Profile</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
