<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Tracker v1.1.3</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="dark">

<div class="topbar">

    <div>
        <h1>Credit Tracker</h1>
        <div class="version-box">
            Version <span id="versionText"></span>
        </div>
    </div>

    <div class="top-controls">
        <input type="text" id="searchInput" placeholder="Search users...">

        <select id="sortSelect">
            <option value="default">Sort</option>
            <option value="highest">Highest Balance</option>
            <option value="lowest">Lowest Balance</option>
            <option value="alphabetical">Alphabetical</option>
        </select>

        <button id="darkModeToggle" class="btn btn-secondary">
            Toggle Theme
        </button>

        <button id="addPersonBtn" class="btn btn-primary">
            + Add Person
        </button>
    </div>

</div>

<div id="peopleContainer" class="people-grid"></div>

<!-- Add Person Modal -->
<div class="modal" id="personModal">
    <div class="modal-content">
        <h2>Add Person</h2>

        <input type="text" id="newPersonName" placeholder="Enter Name">

        <div class="modal-buttons">
            <button class="btn btn-secondary" id="closeModal">Cancel</button>
            <button class="btn btn-primary" id="savePersonBtn">Save</button>
        </div>
    </div>
</div>

<!-- Transaction Modal -->
<div class="modal" id="txModal">
    <div class="modal-content">

        <h2 id="txModalTitle">Transaction</h2>

        <input type="hidden" id="txPersonId">
        <input type="hidden" id="txType">

        <input type="number" step="0.01" id="txAmount" placeholder="Amount">

        <input type="text" id="txReason" placeholder="Reason">

        <input type="password" id="txPassword" placeholder="Admin Password">

        <div class="modal-buttons">
            <button class="btn btn-secondary" id="closeTxModal">Cancel</button>
            <button class="btn btn-primary" id="submitTxBtn">Submit</button>
        </div>

    </div>
</div>

<!-- Delete Modal -->
<div class="modal" id="confirmModal">
    <div class="modal-content">

        <h2>Delete User</h2>

        <p id="confirmMessage"></p>

        <div class="modal-buttons">
            <button class="btn btn-secondary" id="confirmCancelBtn">Cancel</button>
            <button class="btn btn-danger" id="confirmOkBtn">Delete</button>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
