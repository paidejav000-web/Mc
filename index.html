<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Credit Tracker v1.1.6</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="dark">

<div class="topbar">

    <div>
        <h1>Credit Tracker</h1>
        <div class="version-box" onclick="openChangelog()">
            Version <span id="versionText"></span> (click for updates)
        </div>
    </div>

    <div class="top-controls">

        <input id="searchInput" placeholder="Search...">

        <select id="sortSelect">
            <option value="default">Sort</option>
            <option value="highest">Highest</option>
            <option value="lowest">Lowest</option>
            <option value="alphabetical">A-Z</option>
        </select>

        <button id="themeBtn">Toggle Theme</button>
        <button id="addPersonBtn">+ Add Person</button>

    </div>
</div>

<div id="peopleContainer"></div>

<!-- CHANGELOG -->
<div class="modal" id="changelogModal">
    <div class="modal-content">
        <h2>Update Log</h2>
        <div id="changelogText"></div>
        <button onclick="closeAllModals()">Close</button>
    </div>
</div>

<!-- PERSON MODAL -->
<div class="modal" id="personModal">
    <div class="modal-content">
        <h2>Create Account</h2>
        <input id="newPersonName" placeholder="Name">
        <div class="modal-buttons">
            <button onclick="closeAllModals()">Cancel</button>
            <button id="savePersonBtn">Save</button>
        </div>
    </div>
</div>

<!-- TRANSACTION MODAL -->
<div class="modal" id="txModal">
    <div class="modal-content">
        <h2 id="txModalTitle"></h2>

        <input type="hidden" id="txPersonId">
        <input type="hidden" id="txType">

        <input id="txAmount" type="number" step="0.01" placeholder="Amount">
        <input id="txReason" placeholder="Reason">
        <input id="txPassword" type="password" placeholder="Admin Password">

        <div class="modal-buttons">
            <button onclick="closeAllModals()">Cancel</button>
            <button id="submitTxBtn">Submit</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
