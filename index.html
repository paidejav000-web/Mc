<!DOCTYPE html>
<html>
<head>
<title>Credit Tracker v1.1.14</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="blue">

<div class="bg"></div>

<!-- TOP BAR -->
<div class="topbar">

    <h2>Credit Tracker</h2>

    <div class="controls">

        <input id="searchInput" placeholder="Search">

        <select id="sortSelect" class="glass-btn">
            <option value="default">Sort</option>
            <option value="highest">Highest</option>
            <option value="lowest">Lowest</option>
            <option value="az">A-Z</option>
        </select>

        <select id="themeSelect" class="glass-btn">
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
            <option value="green">Green</option>
            <option value="red">Red</option>
            <option value="midnight">Midnight</option>
        </select>

        <button onclick="openLogs()">📜 Logs</button>
        <button onclick="addPerson()">+ Add</button>

    </div>

</div>

<!-- PEOPLE -->
<div id="people"></div>

<!-- HISTORY MODAL -->
<div id="historyModal" class="modal">
    <div class="modal-box scroll">

        <h2 id="historyTitle"></h2>

        <div id="historyList"></div>

        <canvas id="chart"></canvas>

        <button onclick="closeAll()">Close</button>

    </div>
</div>

<!-- LOGS -->
<div id="logModal" class="modal">
    <div class="modal-box scroll">

        <h2>Update Logs</h2>
        <div id="logList"></div>

        <button onclick="closeAll()">Close</button>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
